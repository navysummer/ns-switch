[workspace]
resolver = "3"
members = [
    "crates/ns-switch",
    "crates/ns-ui",
    "crates/ns-store",
    "crates/ns-live",
    "crates/ns-presets",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/navysummer/ns-switch"

[workspace.dependencies]
anyhow = "1"
directories = "6"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

ns-ui = { path = "crates/ns-ui" }
ns-store = { path = "crates/ns-store" }
ns-live = { path = "crates/ns-live" }
ns-presets = { path = "crates/ns-presets" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
