[package]
name = "ns-switch"
version = "0.1.0"
description = "NS Switch - One-click provider switch manager for AI coding tools"
authors = ["NS Switch"]
license = "MIT"
default-run = "ns-switch"
build = "build.rs"
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "devtools",
  "tray-icon",
  "image-ico",
  "image-png",
] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.7"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
opener = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"
flate2 = "1"
tar = "0.4"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
